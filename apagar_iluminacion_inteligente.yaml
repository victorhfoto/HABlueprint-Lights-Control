blueprint:
  name: 💡 Apagar iluminación inteligente
  description: >
    Apaga luces y switches seleccionados mediante etiquetas, áreas o
    entidades concretas. Permite excluir áreas y entidades, ejecutar
    el apagado cuando la casa queda vacía, mediante un tag RFID o a
    una hora determinada, y notificar a la persona que acaba de salir
    cuando es la última persona que abandona la casa.
  domain: automation

  input:

    # =========================================================
    # SELECCIÓN DE ENTIDADES
    # =========================================================

    etiquetas:
      name: 🏷️ Etiquetas
      description: >
        Selecciona una o varias etiquetas. Se incluirán las entidades
        light y switch que tengan alguna de estas etiquetas.
      default: []
      selector:
        label:
          multiple: true

    areas_incluir:
      name: 🏠 Áreas a incluir
      description: >
        Incluye todas las entidades light y switch pertenecientes
        a estas áreas.
      default: []
      selector:
        area:
          multiple: true

    areas_excluir:
      name: 🚫 Áreas a excluir
      description: >
        Excluye las entidades de estas áreas.
        Si un área también está seleccionada en Áreas a incluir,
        la inclusión tiene prioridad.
      default: []
      selector:
        area:
          multiple: true

    entidades_extra:
      name: ➕ Entidades adicionales
      description: >
        Añade manualmente entidades light o switch que no estén
        incluidas mediante etiquetas o áreas.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch

    entidades_excluir:
      name: ❌ Entidades excluidas
      description: >
        Excluye entidades concretas.
        Si una entidad está también seleccionada como entidad adicional,
        la inclusión tiene prioridad.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
            - domain: switch


    # =========================================================
    # PERSONAS
    # =========================================================

    personas:
      name: 👤 Personas
      description: >
        Personas que viven o están consideradas dentro de la casa.
        El apagado por salida solamente se ejecutará cuando ninguna
        de ellas permanezca en casa.
      selector:
        entity:
          multiple: true
          filter:
            - domain: person


    # =========================================================
    # SALIDA
    # =========================================================

    usar_salida:
      name: 🚪 Activar al salir
      description: >
        Ejecuta el apagado cuando una persona sale de casa y se
        convierte en la última persona en abandonar la vivienda.
      default: true
      selector:
        boolean:


    # =========================================================
    # RFID
    # =========================================================

    usar_tag:
      name: 🏷️ Activar mediante RFID
      description: >
        Ejecuta el apagado cuando se detecta el tag RFID seleccionado.
      default: false
      selector:
        boolean:

    tag_id:
      name: ID del tag RFID
      description: >
        ID del tag RFID utilizado para activar el apagado.
      default: ""
      selector:
        text:


    # =========================================================
    # HORA
    # =========================================================

    usar_hora:
      name: ⏰ Activar por hora
      description: >
        Ejecuta el apagado a la hora seleccionada.
      default: true
      selector:
        boolean:

    hora:
      name: Hora
      default: "00:00:00"
      selector:
        time:


    # =========================================================
    # NOTIFICACIÓN
    # =========================================================

    notificar:
      name: 📱 Notificar al salir
      description: >
        Envía una notificación cuando la persona que sale es la
        última persona en abandonar la casa y quedan entidades
        encendidas.
      default: true
      selector:
        boolean:

    servicio_notificacion:
      name: 📱 Destinatario de la notificación
      description: >
        Selecciona el servicio de notificación que recibirá el aviso.
        Por ejemplo, el teléfono de Víctor o el de Idoia.
      default: notify.notify
      selector:
        notify:


# =============================================================
# VARIABLES
# =============================================================

variables:

  etiquetas_input: !input etiquetas
  areas_incluir_input: !input areas_incluir
  areas_excluir_input: !input areas_excluir

  entidades_extra_input: !input entidades_extra
  entidades_excluir_input: !input entidades_excluir

  personas_input: !input personas

  usar_salida_input: !input usar_salida
  usar_tag_input: !input usar_tag
  usar_hora_input: !input usar_hora

  notificar_input: !input notificar
  servicio_notificacion_input: !input servicio_notificacion


  # ===========================================================
  # ENTIDADES DE LAS ETIQUETAS
  # ===========================================================

  entidades_etiquetas: >
    {% set ns = namespace(entidades=[]) %}

    {% for etiqueta in etiquetas_input %}
      {% set ns.entidades =
        ns.entidades + label_entities(etiqueta) %}
    {% endfor %}

    {{ ns.entidades | unique | list }}


  # ===========================================================
  # ENTIDADES DE LAS ÁREAS INCLUIDAS
  # ===========================================================

  entidades_areas_incluir: >
    {% set ns = namespace(entidades=[]) %}

    {% for area in areas_incluir_input %}
      {% set ns.entidades =
        ns.entidades + area_entities(area) %}
    {% endfor %}

    {{ ns.entidades | unique | list }}


  # ===========================================================
  # ENTIDADES DE LAS ÁREAS EXCLUIDAS
  # ===========================================================

  entidades_areas_excluir: >
    {% set ns = namespace(entidades=[]) %}

    {% for area in areas_excluir_input %}
      {% set ns.entidades =
        ns.entidades + area_entities(area) %}
    {% endfor %}

    {{ ns.entidades | unique | list }}


  # ===========================================================
  # TODAS LAS ENTIDADES INCLUIDAS
  #
  # Etiquetas + áreas + entidades manuales
  # ===========================================================

  entidades_incluidas: >
    {{
      (
        entidades_etiquetas
        + entidades_areas_incluir
        + entidades_extra_input
      )
      | unique
      | list
    }}


  # ===========================================================
  # FILTRADO FINAL
  #
  # SOLAMENTE light y switch pueden entrar.
  #
  # automation.*
  # script.*
  # scene.*
  # sensor.*
  # etc.
  #
  # quedan automáticamente fuera.
  #
  # Las entidades incluidas tienen prioridad sobre exclusiones.
  # ===========================================================

  entidades_controladas: >
    {% set ns = namespace(entidades=[]) %}

    {% for entidad in entidades_incluidas %}

      {% set dominio = entidad.split('.')[0] %}

      {% if dominio in ['light', 'switch'] %}

        {% set esta_en_area_excluida =
          entidad in entidades_areas_excluir %}

        {% set esta_excluida =
          entidad in entidades_excluir_input %}

        {% set esta_incluida_explicitamente =
          entidad in entidades_extra_input
          or entidad in entidades_etiquetas
          or entidad in entidades_areas_incluir %}

        {#
          Las inclusiones tienen prioridad.
          Por tanto, una entidad seleccionada mediante una fuente
          de inclusión no puede ser eliminada por una exclusión.
        #}

        {% if esta_incluida_explicitamente %}

          {% set ns.entidades =
            ns.entidades + [entidad] %}

        {% elif not esta_en_area_excluida
              and not esta_excluida %}

          {% set ns.entidades =
            ns.entidades + [entidad] %}

        {% endif %}

      {% endif %}

    {% endfor %}

    {{ ns.entidades | unique | list }}


  # ===========================================================
  # ENTIDADES ENCENDIDAS
  # ===========================================================

  entidades_encendidas: >
    {{
      entidades_controladas
      | select('is_state', 'on')
      | list
    }}


# =============================================================
# TRIGGERS
# =============================================================

triggers:

  # -----------------------------------------------------------
  # RFID
  # -----------------------------------------------------------

  - trigger: tag
    tag_id: !input tag_id
    id: tag


  # -----------------------------------------------------------
  # SALIDA DE PERSONA
  # -----------------------------------------------------------

  - trigger: state
    entity_id: !input personas
    to: "not_home"
    id: salida


  # -----------------------------------------------------------
  # HORA
  # -----------------------------------------------------------

  - trigger: time
    at: !input hora
    id: hora


# =============================================================
# CONDITIONS
# =============================================================

conditions:

  # -----------------------------------------------------------
  # Comprobar qué trigger está activado
  # -----------------------------------------------------------

  - condition: template
    value_template: >
      {{
        (trigger.id == 'tag' and usar_tag_input)
        or
        (trigger.id == 'salida' and usar_salida_input)
        or
        (trigger.id == 'hora' and usar_hora_input)
      }}


  # -----------------------------------------------------------
  # SALIDA:
  #
  # Solo continúa si la persona que acaba de salir es la última.
  # -----------------------------------------------------------

  - condition: template
    value_template: >
      {% if trigger.id != 'salida' %}

        true

      {% else %}

        {{
          expand(personas_input)
          | selectattr('state', 'eq', 'home')
          | list
          | length == 0
        }}

      {% endif %}


# =============================================================
# ACTIONS
# =============================================================

actions:

  # ===========================================================
  # NOTIFICACIÓN
  # ===========================================================

  - choose:

      - conditions:

          - condition: template
            value_template: >
              {{
                notificar_input
                and trigger.id == 'salida'
                and entidades_encendidas | length > 0
              }}

        sequence:

          - action: "{{ servicio_notificacion_input }}"

            data:

              title: "💡 Luces encendidas"

              message: >
                Te has dejado estas entidades encendidas al salir de casa:

                {% for entidad in entidades_encendidas %}

                • {{ state_attr(entidad, 'friendly_name') or entidad }}

                {% endfor %}


  # ===========================================================
  # APAGAR ENTIDADES
  # ===========================================================

  - repeat:

      for_each: "{{ entidades_controladas }}"

      sequence:

        - choose:

            # -------------------------------------------------
            # LIGHT
            # -------------------------------------------------

            - conditions:

                - condition: template
                  value_template: >
                    {{ repeat.item.startswith('light.') }}

              sequence:

                - action: light.turn_off

                  target:
                    entity_id: "{{ repeat.item }}"


            # -------------------------------------------------
            # SWITCH
            # -------------------------------------------------

            - conditions:

                - condition: template
                  value_template: >
                    {{ repeat.item.startswith('switch.') }}

              sequence:

                - action: switch.turn_off

                  target:
                    entity_id: "{{ repeat.item }}"


mode: single
